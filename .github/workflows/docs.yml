name: Build and Deploy Documentation

# Only trigger on pushes to main
on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on a release tag

# Action has permission to write to gh pages
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs and MkDoxy
        run: |
          pip install mkdocs-material 
          pip install mkdoxy
          pip install mike

      - name: Configure Git User
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      # Pushing a release tag
      - name: Deploy Release Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Extract major.minor
          TAG_NAME=${GITHUB_REF_NAME#v}
          MAJOR_MINOR=$(echo $TAG_NAME | cut -d. -f1,2)
          
          # Deploy the version folder and alias it as latest
          mike deploy $MAJOR_MINOR latest --update-aliases --push
          
          # Tell GitHub pages to redirect to /latest/
          mike set-default latest --push

      - name: Deploy Dev Version
      if: github.ref == 'refs/heads/dev'
        run: |
          # Keep a rolling 'dev' version of the docs but hide it from the dropdown
          mike deploy dev --push --hidden